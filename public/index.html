<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Chatbot | IBM Cloud</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f62fe; /* IBM Blue */
            --primary-hover: #0353e9;
            --bg-color: #f4f4f4;
            --chat-bg: #ffffff;
            --text-main: #161616;
            --text-secondary: #525252;
            --bot-bubble: #f4f4f4;
            --user-bubble: #0f62fe;
            --user-text: #ffffff;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header Styling */
        .chat-header {
            padding: 20px 24px;
            background: #161616;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-info h2 span {
            background: var(--primary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .header-info p {
            font-size: 0.8rem;
            color: #c6c6c6;
            margin-top: 4px;
        }

        /* Chat Body / Message Window */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background-color: var(--bot-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background-color: var(--user-bubble);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-bubble);
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input Bar Area */
        .chat-input-area {
            padding: 20px 24px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .chat-input-area button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: var(--primary-hover);
        }

        
        .suggestions {
            padding: 0 24px 12px 24px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: #ffffff;
        }

        .suggestion-chip {
            background: #f4f4f4;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-info">
                <h2>IBM Cloud Assistant <span>AI Search</span></h2>
                <p>Ask anything, get instant answers from your smart knowledge base</p>
            </div>
            <i class="fa-solid fa-cloud" style="font-size: 1.5rem; color: #0f62fe;"></i>
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Hello! 👋 I am your intelligent search assistant running on IBM Cloud. Type any question below or click a quick suggestion to get started!
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="chat-messages" style="padding-top: 0; padding-bottom: 0;">
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="suggestions">
            <div class="suggestion-chip" onclick="sendPreset('What is IBM Cloud?')">What is IBM Cloud?</div>
            <div class="suggestion-chip" onclick="sendPreset('How to deploy an app?')">How to deploy an app?</div>
            <div class="suggestion-chip" onclick="sendPreset('Tell me about cloud databases')">Database options</div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Search or ask a question..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function sendPreset(text) {
            userInput.value = text;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user');
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Show Typing Indicator
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Call Backend API
                
const response = await fetch('https://ibm-ai-chatbot-ycof.onrender.com/api/chat', {

            
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Hide Typing Indicator
                typingIndicator.style.display = 'none';

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Sorry, I couldn't process that request.", 'bot');
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage("Error connecting to IBM Cloud backend server.", 'bot');
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            // Insert before typing indicator
            chatMessages.appendChild(messageDiv);
        }
    </script>

    
<script>
    async function checkLogin() {
        try {
            
const response = await fetch('https://ibm-ai-chatbot-ycof.onrender.com/api/me', {
    credentials: 'include'
});


            if (!response.ok) {
                window.location.replace('/login.html');
                return;
            }
        } catch (error) {
            console.error('Session check failed:', error);
        }
    }

    checkLogin();
</script>

</body>
</html>
