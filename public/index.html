<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Knowledge Chatbot | IBM Cloud</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0f62fe;
            --primary-hover: #0353e9;
            --bg-color: #f4f4f4;
            --chat-bg: #ffffff;
            --text-main: #161616;
            --text-secondary: #525252;
            --bot-bubble: #f4f4f4;
            --user-bubble: #0f62fe;
            --user-text: #ffffff;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            min-height: 450px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .chat-header {
            padding: 20px 24px;
            background: #161616;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-info h2 span {
            background: var(--primary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .header-info p {
            font-size: 0.8rem;
            color: #c6c6c6;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            background: var(--bot-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: var(--user-bubble);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--bot-bubble);
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            margin: 0 2px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -1.1s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: -0.9s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        .suggestions {
            padding: 0 24px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: white;
        }

        .suggestion-chip {
            background: #f4f4f4;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .suggestion-chip:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .chat-input-area {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-input-area button:hover {
            background: var(--primary-hover);
        }

        .chat-input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logoutButton {
            background: transparent;
            color: white;
            border: 1px solid #777;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        #logoutButton:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 95vh;
            }

            .chat-header {
                padding: 16px;
            }

            .header-info p {
                max-width: 240px;
            }

            .chat-messages {
                padding: 16px;
            }

            .suggestions {
                padding: 0 16px 12px;
            }

            .chat-input-area {
                padding: 14px;
            }

            .chat-input-area input {
                padding: 12px;
            }

            .chat-input-area button {
                padding: 12px 16px;
            }

            #logoutButton {
                padding: 7px;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">

        <header class="chat-header">
            <div class="header-info">
                <h2>
                    IBM Cloud Assistant
                    <span>AI Search</span>
                </h2>
                <p id="welcomeText">
                    Ask questions and get answers from your knowledge base.
                </p>
            </div>

            <div class="header-actions">
                <i class="fa-solid fa-cloud"
                   style="font-size: 1.5rem; color: #0f62fe;"></i>
                <button id="logoutButton" type="button">Logout</button>
            </div>
        </header>

        <div class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="message bot">
                Hello! 👋 I am your IBM Cloud Assistant.
                Ask me a question to get started!
            </div>
        </div>

        <div style="padding: 0 24px;">
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="suggestions">
            <button class="suggestion-chip" type="button"
                onclick="sendPreset('What is IBM Cloud?')">
                What is IBM Cloud?
            </button>

            <button class="suggestion-chip" type="button"
                onclick="sendPreset('How to deploy an app?')">
                How to deploy an app?
            </button>

            <button class="suggestion-chip" type="button"
                onclick="sendPreset('Tell me about cloud databases')">
                Database options
            </button>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="Search or ask a question..."
                autocomplete="off"
                required
            >
            <button type="submit" id="sendButton" aria-label="Send message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

    </div>

    <script>
        const API_URL = 'https://ibm-ai-chatbot-ycof.onrender.com';

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatForm = document.getElementById('chatForm');
        const sendButton = document.getElementById('sendButton');
        const logoutButton = document.getElementById('logoutButton');
        const welcomeText = document.getElementById('welcomeText');

        let isSending = false;

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendPreset(text) {
            userInput.value = text;
            userInput.focus();
            chatForm.requestSubmit();
        }

        async function checkLogin() {
            try {
                const response = await fetch(`${API_URL}/api/me`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.status === 401) {
                    window.location.replace('/login.html');
                    return;
                }

                if (!response.ok) {
                    appendMessage(
                        'Login session check failed. Please refresh the page.',
                        'bot'
                    );
                    return;
                }

                const data = await response.json();

                if (data.user && data.user.name) {
                    welcomeText.textContent =
                        `Welcome, ${data.user.name}! Ask me anything about IBM Cloud.`;
                }
            } catch (error) {
                console.error('Session check error:', error);
                appendMessage(
                    'Unable to connect to the backend. Please try again later.',
                    'bot'
                );
            }
        }

        chatForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const text = userInput.value.trim();

            if (!text || isSending) {
                return;
            }

            appendMessage(text, 'user');
            userInput.value = '';

            isSending = true;
            sendButton.disabled = true;
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        message: text
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || `Request failed (${response.status})`
                    );
                }

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage(
                        'The server returned no answer. Please try again.',
                        'bot'
                    );
                }
            } catch (error) {
                console.error('Chat API error:', error);
                appendMessage(
                    error instanceof TypeError
                        ? 'Connection error. Please check the backend and try again.'
                        : error.message,
                    'bot'
                );
            } finally {
                typingIndicator.style.display = 'none';
                isSending = false;
                sendButton.disabled = false;
                userInput.focus();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });

        logoutButton.addEventListener('click', async function () {
            try {
                const response = await fetch(`${API_URL}/api/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });

                if (!response.ok) {
                    console.warn('Logout endpoint returned:', response.status);
                }
            } catch (error) {
                console.error('Logout request failed:', error);
            }

            window.location.replace('/login.html');
        });

        checkLogin();
    </script>
</body>
</html>
